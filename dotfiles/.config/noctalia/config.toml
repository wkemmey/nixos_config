[accessibility]
ui_scale = 1.2

[bar.main]
capsule = true
center = [ "group:g1" ]
end = [ "group:g2" ]
margin_edge = 4
margin_ends = 6
position = "top"
shadow = false
start = [ "workspaces" ]

    [[bar.main.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "clock", "notifications", "weather", "spacer_1" ]
    opacity = 1.0
    padding = 6.0
    widget_spacing = 24

    [[bar.main.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "volume", "sysmon", "tray" ]
    opacity = 1.0
    padding = 8.0
    widget_spacing = 24

[calendar]

[control_center.calendar]
show_events_card = false

[[control_center.shortcuts]]
type = "audio"

[[control_center.shortcuts]]
type = "mic_mute"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "clipboard"

[[control_center.shortcuts]]
type = "wallpaper"

[dock]
background_opacity = 0.0
cross_axis_padding = 4
enabled = true
icon_size = 24
launcher_position = "start"
margin_edge = 2
radius = 12

[hooks]
colors_changed = ["~/.config/matugen/colors-hook.sh"]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 1200.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    timeout = 660.0

[location]
address = "Fredericksburg, VA"

[lockscreen]
blur_intensity = 0.0

[lockscreen_widgets]
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 1.0

[shell]
corner_radius_scale = 0.5
font_family = "JetBrainsMono Nerd Font"

[[shell.session.actions]]
action = "lock"
countdown_seconds = 0.0
enabled = true
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "logout"
countdown_seconds = 0.0
enabled = false
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
countdown_seconds = 0.0
enabled = true
shortcut = "KP_2"
variant = "default"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 0.0
enabled = true
shortcut = "KP_3"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 0.0
enabled = true
shortcut = "KP_4"
variant = "destructive"

[system.monitor]
cpu_poll_seconds = 5
disk_poll_seconds = 11
memory_poll_seconds = 5
network_poll_seconds = 12

[theme]
builtin = "Catppuccin"
community_palette = "Rose Pine Moon"
mode = "dark"
pure_black_dark = true
source = "builtin"
wallpaper_scheme = "m3-content"

[theme.templates.user.matugen_current]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/colors_for_matugen.json"
output_path = "$XDG_CONFIG_HOME/matugen/schemes/current.json"

[wallpaper]
directory = "/home/whit/.cache/wallpaper"

    [wallpaper.default]
    path = "/home/whit/nixos_config/wallpapers/current_resolution/aenami_timeless_3840x2160.png"

    [wallpaper.last]
    path = "/home/whit/nixos_config/wallpapers/current_resolution/aenami_timeless_3840x2160.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/whit/nixos_config/wallpapers/current_resolution/aenami_timeless_3840x2160.png"

[weather]
unit = "fahrenheit"

[widget.clock]
format = " %H:%M  %a  %d %b"

[widget.spacer_1]
length = 8
type = "spacer"

[widget.sysmon]
stat = "gpu_temp"
